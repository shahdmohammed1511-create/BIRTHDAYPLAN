<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>You're Invited - Happy Birthday</title>
<link rel="icon" type="image/svg+xml" href="./public/birthday.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Jost:wght@300;400;500&family=Playfair+Display:ital,wght@0,500;1,400&display=swap">
<style>
:root{--bg:#f3f0e9;--gold:#a8763e;--rose:#b96368;--ink:#482f28;--mut:#806455;--line:rgba(150,103,57,.38);--gg:linear-gradient(100deg,#68333a,#a44d54,#805321,#a44d54,#68333a);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;position:relative;color:var(--ink);font-family:"Jost","Helvetica Neue",sans-serif;font-weight:400;font-size:17px;text-align:center;line-height:1.6;background-color:var(--bg);background-image:radial-gradient(ellipse at 16% 12%,rgba(255,255,255,.86),transparent 39%),radial-gradient(ellipse at 91% 21%,rgba(170,153,132,.12),transparent 33%),radial-gradient(ellipse at 64% 54%,rgba(255,255,255,.72),transparent 46%),linear-gradient(117deg,transparent 0 20%,rgba(164,149,130,.075) 20.2%,rgba(255,255,255,.5) 20.8%,transparent 22% 100%),linear-gradient(31deg,transparent 0 58%,rgba(164,149,130,.07) 58.2%,rgba(255,255,255,.48) 58.9%,transparent 60% 100%),radial-gradient(ellipse at 5% 78%,rgba(160,146,128,.09),transparent 31%),url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='320' height='320'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='.018' numOctaves='3' seed='13' stitchTiles='stitch' result='n'/><feColorMatrix in='n' type='saturate' values='0' result='g'/><feComponentTransfer in='g'><feFuncA type='linear' slope='.09'/></feComponentTransfer></filter><rect width='100%25' height='100%25' filter='url(%23p)'/></svg>"),url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.78' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .39 0 0 0 0 .25 0 0 0 0 .14 0 0 0 .12 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");background-size:auto,auto,auto,auto,auto,auto,320px 320px,240px 240px}
h1,h2{font-family:"Great Vibes","Snell Roundhand",cursive;font-weight:400;margin:0}
#cf{position:fixed;inset:0;width:100%;height:100%;z-index:40;pointer-events:none}
section,footer{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:30px 20px}
.card{background:linear-gradient(145deg,rgba(255,248,233,.95),rgba(242,222,194,.91));border:1px solid rgba(255,244,219,.65);border-radius:22px;padding:26px 20px;backdrop-filter:blur(7px);box-shadow:0 14px 34px rgba(69,40,25,.18),inset 0 1px rgba(255,255,255,.72)}
h2{font-size:42px;line-height:1.2;background:var(--gg);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 8s linear infinite}
h2:after{content:"";display:block;width:120px;height:1px;margin:6px auto 16px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
@keyframes shine{to{background-position:250% 0}}
.tag{font-family:"Playfair Display",serif;font-style:italic;font-size:19px;color:#72413c;margin:0;text-shadow:0 1px 4px rgba(255,249,235,.42)}
.names{font-size:clamp(60px,20vw,104px);line-height:1.1;margin:4px 0;background:var(--gg);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 7s linear infinite}
.age{position:relative;width:132px;height:132px;margin:14px auto}
.age svg{position:absolute;inset:0;animation:spin 24s linear infinite}
.age b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"Playfair Display",serif;font-weight:500;font-size:44px;line-height:1;color:var(--gold)}
.age small{font-family:"Jost";font-weight:400;font-size:11px;letter-spacing:4px;text-transform:uppercase;color:var(--mut)}
@keyframes spin{to{transform:rotate(360deg)}}
.date{letter-spacing:5px;text-transform:uppercase;font-size:13px;color:var(--mut)}
.btn{display:inline-flex;align-items:center;gap:10px;background:linear-gradient(135deg,#d9718c,#e2a07a);color:#fff;border:0;border-radius:99px;padding:12px 30px;font:inherit;font-weight:500;letter-spacing:2px;font-size:13px;text-transform:uppercase;text-decoration:none;cursor:pointer;box-shadow:0 8px 22px rgba(217,113,140,.35)}
/* gift intro */
#gift{position:fixed;inset:0;z-index:30;background:radial-gradient(circle at 50% 40%,#fbebe4,#e6c3b8 75%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;transition:opacity 1s,visibility 1s}
#gift.gone{opacity:0;visibility:hidden}
#gift{overflow:hidden;isolation:isolate;background:radial-gradient(ellipse at 50% 38%,#fffaf1 0,#f6e9df 48%,#ead5cc 100%);color:#4a2b3a}
#gift:before,#gift:after{content:"";position:absolute;left:50%;top:42%;z-index:-1;border-radius:50%;pointer-events:none}
#gift:before{width:min(88vw,390px);aspect-ratio:1;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(228,184,116,.3),rgba(217,151,132,.11) 42%,transparent 70%);filter:blur(3px);animation:halo 4s ease-in-out infinite}
#gift:after{width:min(76vw,330px);aspect-ratio:1;transform:translate(-50%,-50%) rotate(-12deg);border:1px solid rgba(185,138,74,.25);box-shadow:0 0 0 12px rgba(185,138,74,.035),inset 0 0 35px rgba(185,138,74,.07);animation:ring 18s linear infinite}
#gift svg{position:relative;width:min(280px,72vw);overflow:visible;animation:giftFloat 3.6s ease-in-out infinite;filter:drop-shadow(0 18px 22px rgba(88,52,58,.2))}
@keyframes halo{50%{opacity:.65;transform:translate(-50%,-50%) scale(1.08)}}
@keyframes ring{to{transform:translate(-50%,-50%) rotate(348deg)}}
@keyframes giftFloat{50%{transform:translateY(-9px) rotate(-1deg)}}
@keyframes bob{50%{transform:translateY(-10px)}}
#lid{transform-origin:100px 90px;transition:transform 1s cubic-bezier(.16,1,.3,1),opacity .45s .58s}
#gift.open svg{animation:giftReveal 1.05s cubic-bezier(.2,.8,.2,1) both}
#gift.open #lid{transform:translate(48px,-112px) rotate(32deg) scale(1.03);opacity:0}
#gift.open #giftBox{filter:drop-shadow(0 0 22px rgba(233,190,123,.48))}
#gift p{position:relative;margin:0}
#gift .tag{color:#8b4858;font-size:22px;text-shadow:0 2px 18px rgba(185,138,74,.14)}
#gift .date{color:#876d68;font-size:11px;letter-spacing:4px}
#gift svg .giftSpark{transform-box:fill-box;transform-origin:center;animation:giftSparkle 1.8s ease-in-out infinite alternate}
#gift.open .tag{animation:captionReveal .65s .28s both}
#gift.open .date{animation:captionReveal .65s .42s both}
@keyframes giftReveal{0%{transform:translateY(0) scale(1)}38%{transform:translateY(9px) scale(.94)}68%{transform:translateY(-8px) scale(1.035)}100%{transform:translateY(0) scale(1)}}
@keyframes captionReveal{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes giftSparkle{to{opacity:.35;transform:scale(.7)}}
/* timeline */
.tl{list-style:none;margin:0;padding:0 0 0 22px;text-align:left;border-left:1px dashed var(--line)}
.tl li{position:relative;display:flex;gap:14px;align-items:center;padding:12px 0}
.tl li:before{content:"";position:absolute;left:-28px;top:50%;width:11px;height:11px;margin-top:-5px;border-radius:50%;background:var(--rose);box-shadow:0 0 12px var(--rose)}
.ic{width:44px;height:44px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#d9718c,#e2a07a)}
.ic svg{width:22px;height:22px;fill:#fff}
.tl b{display:block;font-family:"Playfair Display",serif;font-weight:500;font-size:19px}
.tl em{font-style:normal;color:var(--gold);font-size:13px;letter-spacing:2px}
.tl span{color:var(--mut);font-size:15px}
/* outfit */
.fit{display:flex;align-items:center;gap:18px;justify-content:center;flex-wrap:wrap}
.fit svg{width:130px;filter:drop-shadow(0 6px 10px rgba(120,60,70,.25));animation:bob 3s ease-in-out infinite}
.fit ul{list-style:none;padding:0;margin:0;text-align:left}
.fit li{padding:3px 0}.fit li:before{content:"";display:inline-block;width:7px;height:7px;margin-right:10px;background:var(--rose);transform:rotate(45deg)}
.sw{display:flex;gap:10px;justify-content:center;margin-top:14px}.sw i{width:26px;height:26px;border-radius:50%;border:2px solid var(--gold)}
/* missions */
.ms{list-style:none;margin:0 0 14px;padding:0;text-align:left}
.ms li{display:flex;align-items:center;gap:14px;padding:12px 14px;margin:8px 0;border:1px solid var(--line);border-radius:14px;cursor:pointer;transition:.3s}
.ms li i{width:24px;height:24px;border-radius:50%;border:2px solid var(--gold);flex:none;display:flex;align-items:center;justify-content:center;transition:.3s}
.ms li i svg{width:14px;height:14px;fill:#fff;opacity:0}
.ms li.done{background:rgba(255,143,171,.12)}.ms li.done span{text-decoration:line-through;opacity:.6}
.ms li.done i{background:var(--rose);border-color:var(--rose)}.ms li.done i svg{opacity:1}
.bar{height:8px;border-radius:8px;background:rgba(0,0,0,.08);overflow:hidden}.bar div{height:100%;width:0;background:linear-gradient(90deg,var(--rose),var(--gold));transition:width .6s}
#win{max-height:0;overflow:hidden;opacity:0;transition:.8s;font-family:"Playfair Display",serif;font-style:italic;font-size:20px;color:#9c4f63}#win.on{max-height:200px;opacity:1;margin-top:16px}
/* photos */
.ph{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pol{background:#fdf8ee;padding:8px 8px 10px;border-radius:4px;color:#3a2a3a;box-shadow:0 10px 24px rgba(120,60,70,.25);transition:transform .4s;cursor:pointer;display:block}
.pol:nth-child(odd){transform:rotate(-3deg)}.pol:nth-child(even){transform:rotate(2.5deg)}.pol:hover{transform:rotate(0) scale(1.04)}
.pol .im{aspect-ratio:1;background:linear-gradient(135deg,#f7c6d3,#f3d9b0);display:flex;align-items:center;justify-content:center;overflow:hidden}
.pol img{width:100%;height:100%;object-fit:cover}.pol .im svg{width:100%;height:100%;display:block}
.pol span{display:block;font-family:"Great Vibes",cursive;font-size:22px;margin-top:4px}
.pol input{display:none}
/* message */
#msg{max-height:0;overflow:hidden;opacity:0;transition:1s;font-family:"Playfair Display",serif;font-style:italic;font-size:20px;line-height:1.8}#msg.on{max-height:900px;opacity:1;margin-bottom:16px}
.sig{font-family:"Great Vibes",cursive;font-size:36px;color:#9c4f63}
/* countdown */
.cd{display:flex;gap:10px;justify-content:center}
.cd div{background:rgba(255,250,246,.7);border:1px solid var(--line);border-radius:16px;padding:12px 4px;min-width:68px}
.cd b{display:block;font-family:"Playfair Display",serif;font-weight:500;font-size:28px;color:#9c4f63}
.cd span{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--mut)}
.reveal{opacity:0;transform:translateY(30px);transition:1s cubic-bezier(.2,.8,.2,1)}.reveal.in{opacity:1;transform:none}
#mus{-webkit-appearance:none;appearance:none;position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));z-index:35;width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:rgba(255,250,246,.9);cursor:pointer;display:none;align-items:center;justify-content:center;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#mus svg{width:20px;height:20px;fill:#9c4f63}#mus.off svg{opacity:.35}
#deco{position:absolute;top:0;left:50%;transform:translateX(-50%);width:min(100%,620px);z-index:0;pointer-events:none}
#deco svg{display:block;width:100%;animation:sway 6s ease-in-out infinite;transform-origin:top center}
@keyframes sway{50%{transform:rotate(.7deg)}}
#deco .b{filter:drop-shadow(0 0 2px rgba(230,201,147,.55))}
@keyframes tw{50%{opacity:.35}}
.fl{position:fixed;bottom:-8px;width:120px;z-index:0;pointer-events:none}.fl.l{left:-10px}.fl.r{right:-10px;transform:scaleX(-1)}
.fl svg{display:block;width:100%;animation:sway2 5s ease-in-out infinite;transform-origin:50% 100%}
@keyframes sway2{50%{transform:rotate(4deg)}}
.cake{width:min(330px,82vw);margin:6px auto 0;cursor:pointer;filter:drop-shadow(0 18px 20px rgba(120,60,70,.28))}
.cake svg{display:block;width:100%}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick .5s ease-in-out infinite alternate;transition:opacity .4s}
@keyframes flick{from{transform:scale(1,1) rotate(-3deg)}to{transform:scale(.9,1.12) rotate(3deg)}}
.out .flame{animation:none;opacity:0;transform:scale(.2)}
.card{background:linear-gradient(145deg,rgba(255,252,249,.9),rgba(255,246,238,.76));border-color:rgba(185,138,74,.38);border-radius:26px;box-shadow:0 18px 48px rgba(82,42,58,.12),inset 0 1px rgba(255,255,255,.8);backdrop-filter:blur(10px)}
.btn{transition:transform .25s,box-shadow .25s}.btn:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(217,113,140,.42)}.btn:focus-visible,#mus:focus-visible,#gift:focus-visible{outline:2px solid var(--gold);outline-offset:5px}
.ms li:hover{transform:translateY(-2px);border-color:rgba(185,138,74,.7);box-shadow:0 8px 20px rgba(82,42,58,.08)}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<canvas id="cf"></canvas><div id="deco"></div><div class="fl l" id="bc1"></div><div class="fl r" id="bc2"></div>
<button id="mus" aria-label="Play music" aria-pressed="false" title="Play music"></button>
<audio id="song" src="./public/ThoseEyes.mp3" preload="auto"></audio>
<div id="gift" role="button" tabindex="0" aria-label="Open your birthday surprise"><svg viewBox="0 0 200 200"><defs><linearGradient id="gr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d98972"/><stop offset=".48" stop-color="#a64f58"/><stop offset="1" stop-color="#71384e"/></linearGradient><linearGradient id="gg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a97839"/><stop offset=".48" stop-color="#fff0c8"/><stop offset="1" stop-color="#bd9251"/></linearGradient><linearGradient id="boxShine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".48" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
<ellipse cx="100" cy="190" rx="68" ry="8" fill="#100e16" opacity=".3"/><g id="giftBox"><rect x="30" y="95" width="140" height="92" rx="8" fill="url(#gr)"/><path d="M38 101h124v78H38z" fill="url(#boxShine)"/><rect x="91" y="95" width="18" height="92" fill="url(#gg2)"/><path d="M30 177h140v10H30z" fill="#512a40" opacity=".2"/><rect x="30" y="95" width="140" height="92" rx="8" fill="none" stroke="#f3d7a5" stroke-opacity=".55"/></g>
<g id="lid"><rect x="22" y="67" width="156" height="35" rx="7" fill="url(#gr)"/><path d="M29 72h142v24H29z" fill="url(#boxShine)"/><rect x="91" y="67" width="18" height="35" fill="url(#gg2)"/><rect x="22" y="94" width="156" height="8" rx="2" fill="#633248" opacity=".25"/><rect x="22" y="67" width="156" height="35" rx="7" fill="none" stroke="#f3d7a5" stroke-opacity=".7"/><ellipse cx="77" cy="54" rx="25" ry="14" transform="rotate(-25 77 54)" fill="none" stroke="url(#gg2)" stroke-width="7"/><ellipse cx="123" cy="54" rx="25" ry="14" transform="rotate(25 123 54)" fill="none" stroke="url(#gg2)" stroke-width="7"/><circle cx="100" cy="61" r="9" fill="url(#gg2)"/><circle cx="100" cy="61" r="3" fill="#fff7df"/></g>
<g fill="#f3d7a5" opacity=".9"><path class="giftSpark" d="M35 53v8m-4-4h8"/><path class="giftSpark" d="M163 41v8m-4-4h8"/><circle cx="47" cy="78" r="2"/><circle cx="153" cy="71" r="2"/></g></svg>
<p class="tag" id="gt"></p><p class="date">Tap to unwrap</p></div>

<section class="reveal" style="padding-top:calc(min(100vw,620px)*.43 + 16px)"><p class="tag">You're invited to celebrate your birthday</p><h1 class="names" style="font-size:clamp(46px,14vw,74px)">Happy Birthday</h1>
<div class="cake" id="cake"><svg viewBox="0 0 300 250"><defs>
<linearGradient id="cakeVanilla" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#d88c78"/><stop offset=".18" stop-color="#f1b7a0"/><stop offset=".52" stop-color="#f8c8ad"/><stop offset=".84" stop-color="#e8a38e"/><stop offset="1" stop-color="#c97a6e"/></linearGradient>
<linearGradient id="cakeBerry" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#a94f5c"/><stop offset=".22" stop-color="#d77a7c"/><stop offset=".55" stop-color="#e89a91"/><stop offset="1" stop-color="#a94f5c"/></linearGradient>
<linearGradient id="cakeCream" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fffef2"/><stop offset=".55" stop-color="#f9eed9"/><stop offset="1" stop-color="#e9d2ae"/></linearGradient>
<linearGradient id="cakeGold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9b6834"/><stop offset=".45" stop-color="#f5dda0"/><stop offset="1" stop-color="#ad783d"/></linearGradient>
<linearGradient id="cakePlate" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fffdf4"/><stop offset="1" stop-color="#d9c4a7"/></linearGradient>
<filter id="cakeShadow" x="-.2" y="-.2" width="1.4" height="1.5"><feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/><feOffset dy="4"/><feComponentTransfer><feFuncA type="linear" slope=".2"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="nameShadow" x="-.2" y="-.5" width="1.4" height="2"><feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#5b342e" flood-opacity=".28"/></filter>
</defs>
<ellipse cx="150" cy="230" rx="138" ry="13" fill="#6c4939" opacity=".14"/><ellipse cx="150" cy="224" rx="139" ry="17" fill="url(#cakePlate)" stroke="#b9905a" stroke-width="1.5"/><ellipse cx="150" cy="221" rx="126" ry="10" fill="none" stroke="#fffdf3" stroke-width="2" opacity=".9"/>
<g filter="url(#cakeShadow)">
<path d="M30 151h240v61a12 12 0 0 1-12 12H42a12 12 0 0 1-12-12z" fill="url(#cakeVanilla)" stroke="#bb786c" stroke-opacity=".38"/>
<path d="M30 152c0-8 10-13 20-8 8-11 20-10 27-2 10-11 22-10 30-1 10-10 22-9 29 0 10-10 22-9 30 0 10-10 22-7 29 2 10-8 23-4 26 5 12-4 22 1 19 10H30z" fill="url(#cakeCream)" stroke="#fffdf3" stroke-width="2"/>
<path d="M35 175q10 9 20 0t20 0t20 0t20 0t20 0t20 0t20 0t20 0t20 0t20 0t20 0t20 0" fill="none" stroke="#fff0d8" stroke-width="2" opacity=".62"/>
<path d="M64 101h172v49a10 10 0 0 1-10 10H74a10 10 0 0 1-10-10z" fill="url(#cakeBerry)" stroke="#a9505d" stroke-opacity=".4"/>
<path d="M64 102c0-7 9-11 16-6 6-9 16-9 23-1 7-9 17-8 23-1 8-8 17-7 23 0 8-8 17-7 23 0 7-8 18-6 22 1 9-3 17 1 17 8H64z" fill="url(#cakeCream)" stroke="#fffdf3" stroke-width="2"/>
<path d="M104 58h92v40a9 9 0 0 1-9 9h-74a9 9 0 0 1-9-9z" fill="url(#cakeVanilla)" stroke="#c88072" stroke-opacity=".38"/>
<path d="M104 59c0-7 8-10 14-5 6-8 14-7 18-1 7-7 14-6 19 0 7-7 15-5 18 1 8-4 16 0 15 6h-92z" fill="url(#cakeCream)" stroke="#fffdf3" stroke-width="2"/>
</g>
<g fill="url(#cakeGold)" stroke="#fff0c6" stroke-width=".7"><circle cx="49" cy="187" r="3.2"/><circle cx="75" cy="190" r="2.5"/><circle cx="225" cy="189" r="3"/><circle cx="251" cy="185" r="2.4"/><circle cx="82" cy="139" r="2.5"/><circle cx="218" cy="139" r="2.5"/></g>
<g fill="none" stroke="url(#cakeGold)" stroke-width="2"><path d="M43 205q7-8 14 0t14 0"/><path d="M229 205q7-8 14 0t14 0"/></g>
<rect x="72" y="188" width="156" height="33" rx="14" fill="url(#cakeCream)" stroke="url(#cakeGold)" stroke-width="1.5"/><rect x="77" y="192" width="146" height="25" rx="11" fill="none" stroke="#fff" stroke-opacity=".72"/>
<rect x="119" y="31" width="7" height="30" rx="3.5" fill="#a94f5c"/><rect x="146" y="29" width="7" height="32" rx="3.5" fill="#d3aa63"/><rect x="173" y="31" width="7" height="30" rx="3.5" fill="#78816a"/>
<path d="M121 36h2m25-2h2m25 2h2" stroke="#fff3dc" stroke-width="1.5" stroke-linecap="round" opacity=".8"/>
<g id="fls"></g>
<text id="cn" x="150" y="213" text-anchor="middle" font-family="Great Vibes,cursive" fill="#75454b" font-size="36" filter="url(#nameShadow)"></text></svg></div>

// Celebration particles
const cv=$("cf"),cx=cv.getContext("2d");let W,H,K=[];
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}rs();addEventListener("resize",rs);
const CC=["#ff8fab","#f3d9a4","#ffffff","#b79cff","#7fd6ff","#ffd166"];
function burst(x,y,n){for(let i=0;i<n;i++)K.push({x,y,vx:(Math.random()-.5)*13,vy:-Math.random()*13-2,r:Math.random()*6,vr:(Math.random()-.5)*.35,w:6+Math.random()*6,h:4+Math.random()*5,c:CC[i%6]})}
function unboxSparkles(x,y){
 const palette=["#fff4d6","#e8c987","#c99b56","#fffaf0"];
 for(let i=0;i<28;i++){
  const a=Math.random()*Math.PI*2,s=.8+Math.random()*3;
  K.push({kind:"sparkle",x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,r:Math.random()*Math.PI,vr:(Math.random()-.5)*.025,size:.8+Math.random()*1.5,life:.9+Math.random()*.5,c:palette[i%palette.length]});
 }
}
(function loop(){cx.clearRect(0,0,W,H);K=K.filter(k=>{
 if(k.kind==="sparkle"){
  k.life-=.016;k.vx*=.985;k.vy=k.vy*.985-.012;k.x+=k.vx;k.y+=k.vy;k.r+=k.vr;
  const alpha=Math.min(1,k.life*2);
  cx.save();cx.globalAlpha=alpha;cx.translate(k.x,k.y);cx.rotate(k.r);cx.fillStyle=k.c;cx.shadowColor=k.c;cx.shadowBlur=4;
  cx.beginPath();cx.moveTo(0,-k.size*2.2);cx.quadraticCurveTo(k.size*.28,-k.size*.28,k.size*2.2,0);cx.quadraticCurveTo(k.size*.28,k.size*.28,0,k.size*2.2);cx.quadraticCurveTo(-k.size*.28,k.size*.28,-k.size*2.2,0);cx.quadraticCurveTo(-k.size*.28,-k.size*.28,0,-k.size*2.2);cx.fill();cx.restore();
  return k.life>0;
 }
 k.vy+=.24;k.vx*=.992;k.x+=k.vx;k.y+=k.vy;k.r+=k.vr;cx.save();cx.translate(k.x,k.y);cx.rotate(k.r);cx.fillStyle=k.c;cx.fillRect(-k.w/2,-k.h/2,k.w,k.h);cx.restore();return k.y<H+30;
});requestAnimationFrame(loop)})();
// Start the song at 1:36; the gift click is the user's playback gesture.
const audio=$("song"),musicStart=96,musicEnd=140,musicButton=$("mus");
let on=false,musicReady=false,clipFinished=false;
function updateMusicControl(playing,message){
 on=playing;musicButton.classList.toggle("off",!playing);musicButton.innerHTML=svg(playing?"pause":"play");
 musicButton.setAttribute("aria-label",playing?"Pause music":"Play music");
 musicButton.setAttribute("aria-pressed",String(playing));
 musicButton.title=message|| (playing?"Pause music":"Play music");
}
function configureMusicStart(){
 if(!Number.isFinite(audio.duration)||audio.duration<=musicStart){
  console.error("The birthday song is shorter than the requested 1:36 start point.");
  updateMusicControl(false,"Song is too short to start at 1:36.");
  return;
 }
 audio.currentTime=musicStart;musicReady=true;
}
audio.addEventListener("loadedmetadata",configureMusicStart,{once:true});
audio.addEventListener("play",()=>updateMusicControl(true));
audio.addEventListener("pause",()=>updateMusicControl(false));
audio.addEventListener("ended",()=>updateMusicControl(false,"Song finished. Tap to play again."));
audio.addEventListener("timeupdate",()=>{
 if(on&&audio.currentTime>=musicEnd){
  audio.currentTime=musicEnd;clipFinished=true;audio.pause();
 }
});
audio.addEventListener("error",()=>{console.error("The birthday song could not be loaded.",audio.error);updateMusicControl(false,"Song could not be loaded.");});
if(audio.readyState>=HTMLMediaElement.HAVE_METADATA)configureMusicStart();
function setMus(playing){
 if(!playing){audio.pause();return}
 if((audio.ended||clipFinished)&&musicReady){audio.currentTime=musicStart;clipFinished=false}
 audio.play().catch(error=>{
  if(error.name!=="AbortError")console.error("The birthday song could not start playing.",error);
  updateMusicControl(false,"Playback failed. Tap to try again.");
 });
}
musicButton.onclick=()=>setMus(!on);
// gift intro
let opened=false;
$("gift").onclick=()=>{if(opened)return;opened=true;$("gift").classList.add("open");$("mus").style.display="flex";setMus(true);
 setTimeout(()=>unboxSparkles(innerWidth/2,innerHeight*.45),500);
 setTimeout(()=>$("gift").classList.add("gone"),1900)};
$("gift").onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();$("gift").click()}};
const io=new IntersectionObserver(es=>es.forEach(e=>e.isIntersecting&&e.target.classList.add("in")),{threshold:.15});
document.querySelectorAll(".reveal").forEach(e=>io.observe(e));
</script>
